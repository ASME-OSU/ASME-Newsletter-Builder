<svg xmlns="http://www.w3.org/2000/svg" width="960" height="210" viewBox="0 0 960 210" role="img" aria-labelledby="title desc"><title id="title">Your newsletter workflow</title><desc id="desc">Choose calendar events, build your newsletter, and review it before sending.</desc><g font-family="Arial, sans-serif"><g transform="translate(12 12)"><rect width="280" height="186" rx="18" fill="#edf3fa"/><rect x="22" y="25" width="65" height="66" rx="10" fill="#fff" stroke="#9db4d0" stroke-width="2"/><path d="M22 44h65m-49-28v17m33-17v17" fill="none" stroke="#173b61" stroke-width="3"/><g fill="#ba0c2f"><rect x="36" y="55" width="11" height="11" rx="2"/><rect x="58" y="55" width="11" height="11" rx="2"/></g><path d="m37 78 7 6 15-14" stroke="#176b4b" stroke-width="3" fill="none"/><text x="22" y="126" font-size="21" font-weight="700" fill="#15253a">Choose your events</text><text x="22" y="153" font-size="15" fill="#53647b">Pick what belongs in this issue.</text></g><g transform="translate(338 12)"><rect width="280" height="186" rx="18" fill="#f8f0f1"/><rect x="22" y="20" width="88" height="77" rx="9" fill="#fff" stroke="#cba4ae" stroke-width="2"/><path d="M23 40h86" stroke="#ba0c2f" stroke-width="5"/><rect x="35" y="52" width="23" height="23" rx="4" fill="#e8eff9"/><path d="M67 54h28M67 65h24M35 84h60" stroke="#8194aa" stroke-width="3" stroke-linecap="round"/><text x="22" y="126" font-size="21" font-weight="700" fill="#15253a">Build your issue</text><text x="22" y="153" font-size="15" fill="#53647b">Add your highlights and message.</text></g><g transform="translate(664 12)"><rect width="280" height="186" rx="18" fill="#eaf5ef"/><circle cx="58" cy="56" r="33" fill="#fff" stroke="#91b99f" stroke-width="2"/><path d="m41 55 12 12 23-25" stroke="#176b4b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="22" y="126" font-size="21" font-weight="700" fill="#15253a">Review and copy</text><text x="22" y="153" font-size="15" fill="#53647b">Test it in Brevo before sending.</text></g><g stroke="#6f829a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M303 102h23m-8-8 8 8-8 8M629 102h23m-8-8 8 8-8 8"/></g></g></svg>
